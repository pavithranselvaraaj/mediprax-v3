{% extends "base.html" %}
{% block title %}Change Password — Mediprax{% endblock %}
{% block page_title %}<i class="bi bi-key me-2 text-primary"></i>Change Password{% endblock %}
{% block content %}
<div class="card" style="max-width:420px">
  <div class="card-header"><span class="fw-semibold text-primary">Change Your Password</span></div>
  <div class="card-body">
    <form method="POST">
      <div class="mb-3"><label class="form-label small fw-semibold">Current Password</label><input type="password" name="old_password" class="form-control" required/></div>
      <div class="mb-3"><label class="form-label small fw-semibold">New Password</label><input type="password" name="new_password" class="form-control" required minlength="6" placeholder="Minimum 6 characters"/></div>
      <button type="submit" class="btn btn-primary" style="border-radius:9px"><i class="bi bi-check-lg me-1"></i>Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
