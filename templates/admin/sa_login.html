<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mediprax Super Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<style>
  body{min-height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif}
  .card{width:390px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:2.5rem 2rem}
  .brand-logo{width:68px;height:68px;border-radius:16px;background:linear-gradient(135deg,#7b2d8b,#e91e8c);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;color:#fff;font-size:2rem}
  .form-control{border-radius:10px}.input-group-text{border-radius:10px 0 0 10px!important;background:#f0f0f0;border-right:none}.form-control{border-radius:0 10px 10px 0!important;border-left:none}
  .btn-login{width:100%;border-radius:10px;border:none;color:#fff;font-weight:600;padding:.7rem;background:linear-gradient(135deg,#7b2d8b,#e91e8c)}
  .warn{background:#fef3c7;border:1px solid #f59e0b;border-radius:10px;padding:.5rem 1rem;font-size:.8rem;color:#92400e;margin-bottom:1rem;text-align:center}
</style>
</head><body>
<div class="card bg-white">
  <div class="brand-logo"><i class="bi bi-shield-lock-fill"></i></div>
  <h5 class="text-center fw-bold mb-1" style="color:#1a1a2e">Super Admin Panel</h5>
  <p class="text-center text-muted small mb-2">Mediprax HMS — Owner Access</p>
  <div class="warn"><i class="bi bi-person-badge me-1"></i>Only for Pavithran</div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="alert alert-{{ cat }} py-2 px-3 rounded-3 small">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="mb-3"><label class="form-label small fw-semibold text-secondary">Email</label>
      <div class="input-group"><span class="input-group-text"><i class="bi bi-envelope"></i></span>
      <input type="email" name="email" class="form-control" required autofocus placeholder="your@email.com" autocomplete="email"/></div></div>
    <div class="mb-4"><label class="form-label small fw-semibold text-secondary">Password</label>
      <div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span>
      <input type="password" name="password" class="form-control" required placeholder="Password"/></div></div>
    <button type="submit" class="btn btn-login"><i class="bi bi-shield-check me-2"></i>Access Admin Panel</button>
  </form>
  <div class="text-center mt-3"><a href="/login" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Hospital Login</a></div>
</div>
{% include '_csrf.html' %}
</body></html>
